# ==============================================================================
# NEXORA ERP — Single-Domain Apache VirtualHost Configuration (VPS / Dedicated)
#
# Required modules: mod_ssl, mod_proxy, mod_proxy_http, mod_rewrite, mod_headers
# Replace `abcd.com`, `/var/www/nexora`, and `127.0.0.1:3001` as needed.
# ==============================================================================

<VirtualHost *:80>
    ServerName abcd.com
    ServerAlias www.abcd.com

    RewriteEngine On
    RewriteRule ^ https://abcd.com%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName abcd.com
    ServerAlias www.abcd.com

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/abcd.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/abcd.com/privkey.pem
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1

    DocumentRoot /var/www/nexora/dist

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # 1. Server-Sent Events (SSE) — immediate flush, no compression buffering, long timeout
    <LocationMatch "^/api/(events|performance/events/stream|performance/live/stream)$">
        SetEnv no-gzip 1
        ProxyPass        http://127.0.0.1:3001 flushpackets=on connectiontimeout=10 timeout=3600
        ProxyPassReverse http://127.0.0.1:3001
    </LocationMatch>

    # 2. REST API Proxy -> Private Express Backend
    ProxyPass        /api     http://127.0.0.1:3001/api connectiontimeout=10 timeout=60
    ProxyPassReverse /api     http://127.0.0.1:3001/api

    # 3. Public Uploads Proxy
    ProxyPass        /uploads http://127.0.0.1:3001/uploads connectiontimeout=10 timeout=30
    ProxyPassReverse /uploads http://127.0.0.1:3001/uploads

    # 4. Static React Frontend + SPA Fallback
    <Directory /var/www/nexora/dist>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteCond %{REQUEST_URI} !^/uploads/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
</VirtualHost>
