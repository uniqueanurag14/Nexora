# ==============================================================================
# NEXORA ERP — Single-Domain Nginx Reverse Proxy Configuration
#
# Use on VPS / Dedicated / CloudLinux servers where you manage Nginx vhosts.
# Replace `abcd.com`, `/var/www/nexora`, and `127.0.0.1:3001` to match your server.
# ==============================================================================

# Redirect all HTTP traffic permanently to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name abcd.com www.abcd.com;

    # Allow Let's Encrypt ACME HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://abcd.com$request_uri;
    }
}

# Optional: Canonicalize https://www.abcd.com -> https://abcd.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.abcd.com;

    ssl_certificate     /etc/letsencrypt/live/abcd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abcd.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://abcd.com$request_uri;
}

# Primary Single-Domain HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name abcd.com;

    # TLS Certificates (Let's Encrypt / Commercial SSL)
    ssl_certificate     /etc/letsencrypt/live/abcd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abcd.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Match Express REQUEST_BODY_LIMIT (5mb + small multipart overhead)
    client_max_body_size 6m;

    # Built React SPA static root (`npm run build`)
    root /var/www/nexora/dist;
    index index.html;

    # Deny dotfiles (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 1. Server-Sent Events (SSE) — disable buffering & extend read timeout
    location ~ ^/api/(events|performance/events/stream|performance/live/stream)$ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";

        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
        gzip               off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }

    # 2. REST API Proxy -> Private Express Backend (127.0.0.1:3001)
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 3. Uploaded Avatars / Public Uploads Proxy (served with nosniff by Express)
    location /uploads/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # 4. Content-Hashed Vite Assets — Long-Term Immutable Caching
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 5. React SPA Fallback (serves /, /admin, /inventory, /security-center, etc.)
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
